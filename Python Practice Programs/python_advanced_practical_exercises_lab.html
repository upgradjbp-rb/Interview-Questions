<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Master 65 • Advanced Algorithms, OOP & Systems Lab</title>
  
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #388bfd;
      --hint-accent: #d29922;
      --hint-bg: rgba(210, 153, 34, 0.08);
      --sol-accent: #3fb950;
      --sol-bg: rgba(63, 185, 80, 0.08);
      --code-bg: #090d13;
      --code-border: #21262d;
      --badge-bg: #21262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      padding: 0 1rem 3rem 1rem;
    }

    /* Sticky Header & Progress Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 17, 23, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 0;
      margin-bottom: 1.8rem;
    }

    .header-content {
      max-width: 1050px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .title-row h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .title-row h1 i {
      color: var(--accent);
    }

    .badge-counter {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--card-border);
      border-radius: 999px;
      margin-top: 1rem;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--sol-accent));
      transition: width 0.3s ease;
    }

    /* Controls & Filtering */
    .controls-wrapper {
      max-width: 1050px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1.1rem;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0b0f17;
      border-color: var(--accent);
      font-weight: 700;
    }

    .quick-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    .action-btn {
      background: #21262d;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    /* Main Container */
    main {
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Exercise Card */
    .exercise-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .exercise-card:hover {
      border-color: #58a6ff60;
    }

    .card-header {
      padding: 1.15rem 1.4rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      background: rgba(22, 27, 34, 0.7);
    }

    .card-header-left {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #fff;
    }

    .card-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .category-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cat-dsa { background: rgba(88, 166, 255, 0.15); color: var(--accent); border: 1px solid rgba(88, 166, 255, 0.3); }
    .cat-func { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .cat-oop { background: rgba(245, 158, 11, 0.15); color: var(--hint-accent); border: 1px solid rgba(245, 158, 11, 0.3); }
    .cat-tools { background: rgba(63, 185, 80, 0.15); color: var(--sol-accent); border: 1px solid rgba(63, 185, 80, 0.3); }

    .card-body {
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .purpose-box {
      font-size: 0.88rem;
      color: var(--text-muted);
      border-left: 3px solid var(--accent);
      padding-left: 0.8rem;
      font-style: italic;
    }

    .io-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.2rem;
    }

    @media (max-width: 640px) {
      .io-grid { grid-template-columns: 1fr; }
    }

    .io-block {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      overflow-x: auto;
    }

    .io-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .complete-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .complete-toggle input {
      accent-color: var(--sol-accent);
      width: 1.15rem;
      height: 1.15rem;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.95rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-hint {
      background: var(--hint-bg);
      color: var(--hint-accent);
      border-color: rgba(210, 153, 34, 0.3);
    }

    .btn-hint:hover {
      background: rgba(210, 153, 34, 0.2);
    }

    .btn-solution {
      background: var(--sol-bg);
      color: var(--sol-accent);
      border-color: rgba(63, 185, 80, 0.3);
    }

    .btn-solution:hover {
      background: rgba(63, 185, 80, 0.2);
    }

    .drawer {
      display: none;
      border-radius: 6px;
      padding: 1rem;
      font-size: 0.9rem;
      animation: slideDown 0.2s ease forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .drawer.active {
      display: block;
    }

    .hint-drawer {
      background: var(--hint-bg);
      border: 1px solid rgba(210, 153, 34, 0.3);
      color: #eac54f;
    }

    .solution-drawer {
      background: rgba(63, 185, 80, 0.04);
      border: 1px solid rgba(63, 185, 80, 0.25);
    }

    .code-container {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.8rem;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0.8rem;
      background: #11151c;
      border-bottom: 1px solid var(--code-border);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .copy-btn:hover {
      color: var(--text-main);
      background: #1f242c;
    }

    pre code {
      display: block;
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #e6edf3;
      overflow-x: auto;
      white-space: pre;
    }

    .explanation {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--card-bg);
      padding: 0.85rem;
      border-radius: 6px;
      border-left: 3px solid var(--sol-accent);
    }

    .explanation strong {
      color: var(--text-main);
    }

    footer {
      max-width: 1050px;
      margin: 3rem auto 0 auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="title-row">
        <h1><i class="fa-brands fa-python"></i> Python Master 65 • Advanced Algorithms, OOP &amp; Systems</h1>
        <div class="badge-counter" id="progress-text">0 / 65 Solved (0%)</div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </header>

  <!-- Controls, Filter Chips, and Search -->
  <div class="controls-wrapper">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search all 65 exercises (e.g. Singleton, Decorator, Binary Search, Context Manager, Regex, MRO)..." />
    <div class="controls">
      <button class="filter-btn active" data-filter="all">All (65)</button>
      <button class="filter-btn" data-filter="cat-dsa">Data Structures &amp; Algorithms</button>
      <button class="filter-btn" data-filter="cat-func">Advanced &amp; Functional</button>
      <button class="filter-btn" data-filter="cat-oop">Object-Oriented Programming (OOP)</button>
      <button class="filter-btn" data-filter="cat-tools">Practical &amp; Systems</button>
      
      <div class="quick-actions">
        <button class="action-btn" onclick="toggleAllHints()"><i class="fa-regular fa-lightbulb"></i> Toggle Hints</button>
        <button class="action-btn" onclick="collapseAll()"><i class="fa-solid fa-compress"></i> Collapse All</button>
      </div>
    </div>
  </div>

  <main id="exercises-list">
    <!-- Rendered dynamically by JavaScript -->
  </main>

  <footer>
    Python Master 65 • Comprehensive Advanced Python 3 Curriculum
  </footer>

  <script>
    const exercisesData = [
      {
        id: 1,
        title: "List Comprehension Mastery",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Generate a list of squares for all even numbers from 1 to 20, but replace any square divisible by 4 with its negative value using list comprehension.",
        purpose: "Learn conditional logic and ternary expressions within list comprehensions.",
        input: "Range: 1 to 20 (Evens only)",
        output: "[-4, -16, -36, -64, -100, -144, -196, -256, -324, -400]",
        hint: "Combine filtering `if x % 2 == 0` at the end with a ternary value expression `(-x**2 if (x**2) % 4 == 0 else x**2)` at the front.",
        code: `# List comprehension with ternary expression and predicate filter
res = [-x**2 if (x**2) % 4 == 0 else x**2 for x in range(1, 21) if x % 2 == 0]
print(res)`,
        explanation: "Since all squares of even numbers are divisible by 4, every term receives the negative sign. The ternary operator handles element transformation while the trailing if filters the domain."
      },
      {
        id: 2,
        title: "Dictionary Merging with Logic",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Merge two dictionaries such that if a key exists in both, their numerical values are added together rather than overwritten.",
        purpose: "Understand dictionary reconciliation and key collision handling.",
        input: "d1 = {'a': 10, 'b': 20}, d2 = {'b': 30, 'c': 40}",
        output: "{'a': 10, 'b': 50, 'c': 40}",
        hint: "Initialize a copy of d1, then loop through d2 and use `merged[k] = merged.get(k, 0) + v`.",
        code: `d1 = {'a': 10, 'b': 20}
d2 = {'b': 30, 'c': 40}

merged = dict(d1)
for k, v in d2.items():
    merged[k] = merged.get(k, 0) + v

print(merged)`,
        explanation: "Using dict.get(k, 0) safely retrieves existing values or defaults to 0, ensuring accumulated summation without KeyErrors."
      },
      {
        id: 3,
        title: "Frequency Map with Counter",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Given a list of words, find the top 2 most frequent words and their exact frequencies using Python's collections.Counter.",
        purpose: "Explore collections.Counter for multi-set arithmetic and ranking.",
        input: "words = ['apple', 'banana', 'apple', 'cherry', 'banana', 'apple']",
        output: "[('apple', 3), ('banana', 2)]",
        hint: "Instantiate `Counter(words)` and invoke `.most_common(2)`.",
        code: `from collections import Counter

words = ['apple', 'banana', 'apple', 'cherry', 'banana', 'apple']
counts = Counter(words)
print(counts.most_common(2))`,
        explanation: "Counter creates an O(n) hash map of element frequencies. The .most_common(k) method uses a heap internally to extract top k elements in O(n log k) time."
      },
      {
        id: 4,
        title: "Anagram Checker",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Write a function to check if two strings are anagrams of each other (contain the same characters with identical counts, ignoring spaces and casing).",
        purpose: "Understand frequency mapping versus sorting for string equality verification.",
        input: "s1 = 'Listen', s2 = 'Silent'",
        output: "True",
        hint: "Strip spaces, convert to lowercase, and check if `Counter(s1) == Counter(s2)`.",
        code: `from collections import Counter

def is_anagram(s1, s2):
    clean1 = s1.replace(" ", "").lower()
    clean2 = s2.replace(" ", "").lower()
    return Counter(clean1) == Counter(clean2)

print(is_anagram('Listen', 'Silent'))
print(is_anagram('Hello', 'World'))`,
        explanation: "Comparing two Counter objects performs an O(n) multi-set equality check without the O(n log n) overhead of sorting."
      },
      {
        id: 5,
        title: "Flatten a Nested List",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Write a recursive function that flattens an arbitrarily nested list of integers into a single 1D list.",
        purpose: "Learn recursive tree traversal and instance checking.",
        input: "[1, [2, [3, 4], 5], 6, [7, 8]]",
        output: "[1, 2, 3, 4, 5, 6, 7, 8]",
        hint: "Iterate through items; if `isinstance(item, list)`, recurse and extend, otherwise append.",
        code: `def flatten(nested):
    flat = []
    for item in nested:
        if isinstance(item, list):
            flat.extend(flatten(item))
        else:
            flat.append(item)
    return flat

data = [1, [2, [3, 4], 5], 6, [7, 8]]
print(flatten(data))`,
        explanation: "Depth-first recursion visits leaf values while unwrapping arbitrary levels of list nesting."
      },
      {
        id: 6,
        title: "Reverse Each Word of a String",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Given a sentence, reverse every individual word while preserving the original word positions and spacing.",
        purpose: "String tokenization and element-wise transformation.",
        input: "'Python is awesome'",
        output: "'nohtyP si emosewa'",
        hint: "Split the sentence into words, apply `word[::-1]` to each, and join with `' '`.",
        code: `sentence = "Python is awesome"
reversed_words = " ".join(word[::-1] for word in sentence.split(" "))
print(reversed_words)`,
        explanation: "The generator expression reverses individual word tokens without altering their surrounding structural sequence."
      },
      {
        id: 7,
        title: "Palindrome Sentence",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Check if an entire sentence is a palindrome, considering only alphanumeric characters and ignoring letter cases.",
        purpose: "Two-pointer string sanitation and validation.",
        input: "'A man, a plan, a canal: Panama'",
        output: "True",
        hint: "Filter the string using `[c.lower() for c in s if c.isalnum()]` and test if it equals its reverse.",
        code: `def is_palindrome_sentence(s):
    cleaned = [c.lower() for c in s if c.isalnum()]
    return cleaned == cleaned[::-1]

print(is_palindrome_sentence("A man, a plan, a canal: Panama"))
print(is_palindrome_sentence("Race a car"))`,
        explanation: "c.isalnum() strips punctuation and whitespace, standardizing the character array before symmetry comparison."
      },
      {
        id: 8,
        title: "List Comprehension Filtering (Advanced)",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "From a list of names, extract the uppercase forms of names that have more than 4 letters and start with vowels.",
        purpose: "Multi-condition predicate filtering in comprehensions.",
        input: "['Alice', 'Bob', 'Ursula', 'Oliver', 'Eve', 'Ian']",
        output: "['ALICE', 'URSULA', 'OLIVER']",
        hint: "Filter with `if len(name) > 4 and name[0].upper() in 'AEIOU'`.",
        code: `names = ['Alice', 'Bob', 'Ursula', 'Oliver', 'Eve', 'Ian']
vowel_names = [
    n.upper() for n in names 
    if len(n) > 4 and n[0].upper() in 'AEIOU'
]
print(vowel_names)`,
        explanation: "Combines length constraints and membership checks within a single pass comprehension."
      },
      {
        id: 9,
        title: "Remove Duplicates (Preserving Order)",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Remove all duplicates from a list while maintaining the exact relative order of first appearance.",
        purpose: "Explore order-preserving set patterns and dict.fromkeys() in O(n) time.",
        input: "[4, 5, 2, 4, 1, 2, 5, 3]",
        output: "[4, 5, 2, 1, 3]",
        hint: "Use `list(dict.fromkeys(lst))` or a seen set in a loop.",
        code: `data = [4, 5, 2, 4, 1, 2, 5, 3]
# In Python 3.7+, dictionary key insertion order is guaranteed
unique_order = list(dict.fromkeys(data))
print(unique_order)`,
        explanation: "dict.fromkeys() discards subsequent duplicate insertions in O(1) hash lookup time while maintaining initial encounter order."
      },
      {
        id: 10,
        title: "Circular Shift (Rotation)",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Rotate a list to the right by k steps. Elements shifted off the end should wrap around to the front.",
        purpose: "Index slicing and modular arithmetic.",
        input: "lst = [1, 2, 3, 4, 5, 6, 7], k = 3",
        output: "[5, 6, 7, 1, 2, 3, 4]",
        hint: "Normalize k via `k = k % len(lst)`. Slicing `lst[-k:] + lst[:-k]` handles the wrap-around.",
        code: `def rotate_right(lst, k):
    if not lst:
        return lst
    k = k % len(lst)
    return lst[-k:] + lst[:-k]

print(rotate_right([1, 2, 3, 4, 5, 6, 7], 3))`,
        explanation: "Modular reduction k % len(lst) accommodates shift magnitudes larger than the collection length."
      },
      {
        id: 11,
        title: "Dictionary Merging (Value Grouping)",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Group student names into lists by their respective grade letters from a list of (name, grade) tuples.",
        purpose: "Using collections.defaultdict for automated bucket accumulation.",
        input: "[('Alice', 'A'), ('Bob', 'B'), ('Charlie', 'A'), ('Dave', 'C')]",
        output: "{'A': ['Alice', 'Charlie'], 'B': ['Bob'], 'C': ['Dave']}",
        hint: "Use `defaultdict(list)` and append each student to `grouped[grade]`.",
        code: `from collections import defaultdict

records = [('Alice', 'A'), ('Bob', 'B'), ('Charlie', 'A'), ('Dave', 'C')]
grouped = defaultdict(list)

for name, grade in records:
    grouped[grade].append(name)

print(dict(grouped))`,
        explanation: "defaultdict(list) initializes an empty list upon first access of any new key, eliminating manual existence checks."
      },
      {
        id: 12,
        title: "Inverted Index",
        category: "cat-dsa",
        catLabel: "Data Structures",
        problem: "Build an inverted index mapping each unique word to a set of document IDs in which it appears.",
        purpose: "Fundamental data structure behind full-text search engines.",
        input: "docs = {1: 'hello world', 2: 'hello python', 3: 'world python'}",
        output: "{'hello': {1, 2}, 'world': {1, 3}, 'python': {2, 3}}",
        hint: "Loop through document id and text, split text into words, and add doc_id to `index[word]`.",
        code: `from collections import defaultdict

docs = {1: 'hello world', 2: 'hello python', 3: 'world python'}
inverted_index = defaultdict(set)

for doc_id, text in docs.items():
    for word in text.split():
        inverted_index[word].add(doc_id)

print(dict(inverted_index))`,

    result = []

            shifted = chr((ord(c) - base + shift) % 26 + base)
            result.append(shifted)
        else:
            result.append(c)
    return "".join(result)

encrypted = caesar_cipher("Hello World", 3)

    const STORAGE_KEY = 'py_master_65_progress';

    function getSolvedList() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveSolvedList(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function toggleComplete(id) {
      let solved = getSolvedList();
      if (solved.includes(id)) {
        solved = solved.filter(item => item !== id);
      } else {
        solved.push(id);
      }
      saveSolvedList(solved);
      updateProgress();
    }

    function updateProgress() {
      const solved = getSolvedList();
      const count = solved.length;
      const total = exercisesData.length;
      const pct = Math.round((count / total) * 100);

      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').innerText = `${count} / ${total} Solved (${pct}%)`;

      exercisesData.forEach(ex => {
        const checkbox = document.getElementById(`check-${ex.id}`);
        if (checkbox) {
          checkbox.checked = solved.includes(ex.id);
        }
      });
    }

    function toggleDrawer(id) {
      const drawer = document.getElementById(id);
      if (drawer) {
        drawer.classList.toggle('active');
      }
    }

    function copyCode(elementId, btn) {
      const codeElement = document.getElementById(elementId);
      if (!codeElement) return;
      const codeText = codeElement.innerText;
      
      navigator.clipboard.writeText(codeText).then(() => {
        const origText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check" style="color: #3fb950"></i> Copied!';
        setTimeout(() => {
          btn.innerHTML = origText;
        }, 1800);
      });
    }

    function toggleAllHints() {
      const hints = document.querySelectorAll('.hint-drawer');
      const anyOpen = Array.from(hints).some(d => d.classList.contains('active'));
      hints.forEach(d => {
        if (anyOpen) d.classList.remove('active');
        else d.classList.add('active');
      });
    }

    function collapseAll() {
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('active'));
    }

    function renderExercises(list) {
      const container = document.getElementById('exercises-list');
      const solved = getSolvedList();

      container.innerHTML = list.map(ex => `
        <article class="exercise-card" data-category="${ex.category}" id="ex-${ex.id}">
          <div class="card-header">
            <div class="card-header-left">
              <div class="card-title">Exercise ${ex.id}: ${ex.title}</div>
              <div class="card-meta">
                <span class="category-tag ${ex.category}">${ex.catLabel}</span>
              </div>
            </div>
            <label class="complete-toggle">
              <input type="checkbox" id="check-${ex.id}" onchange="toggleComplete(${ex.id})" ${solved.includes(ex.id) ? 'checked' : ''}> Solved
            </label>
          </div>
          <div class="card-body">
            <p><strong>Practice Problem:</strong> ${ex.problem}</p>
            <div class="purpose-box">${ex.purpose}</div>
            
            <div class="io-grid">
              <div class="io-block">
                <div class="io-label"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sample Input</div>
                ${ex.input}
              </div>
              <div class="io-block">
                <div class="io-label"><i class="fa-solid fa-square-poll-vertical"></i> Expected Output</div>
                ${ex.output}
              </div>
            </div>

            <div class="button-group">
              <button class="btn btn-hint" onclick="toggleDrawer('hint-${ex.id}')"><i class="fa-regular fa-lightbulb"></i> Hint</button>
              <button class="btn btn-solution" onclick="toggleDrawer('sol-${ex.id}')"><i class="fa-solid fa-code"></i> Show Solution</button>
            </div>

            <div class="drawer hint-drawer" id="hint-${ex.id}">
              <i class="fa-solid fa-circle-info"></i> ${ex.hint}
            </div>

            <div class="drawer solution-drawer" id="sol-${ex.id}">
              <div class="code-container">
                <div class="code-header">
                  <span>Python 3 • Verified Solution</span>
                  <button class="copy-btn" onclick="copyCode('code-${ex.id}', this)"><i class="fa-regular fa-copy"></i> Copy Code</button>
                </div>
                <pre><code id="code-${ex.id}">${escapeHtml(ex.code)}</code></pre>
              </div>
              <div class="explanation">
                <strong>How it Works:</strong> ${ex.explanation}
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    let currentCategory = 'all';

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      
      const filtered = exercisesData.filter(ex => {
        const matchesCategory = currentCategory === 'all' || ex.category === currentCategory;
        const matchesSearch = !query || 
          ex.title.toLowerCase().includes(query) || 
          ex.problem.toLowerCase().includes(query) || 
          ex.code.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      renderExercises(filtered);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-filter');
        filterCards();
      });
    });

    document.getElementById('searchInput').addEventListener('input', filterCards);

    // Initial boot
    document.addEventListener('DOMContentLoaded', () => {
      renderExercises(exercisesData);
      updateProgress();
    });
  </script>
</body>
</html>
