<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python List Mastery: 45 Practice Questions</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #141b26;
      --card-border: #243042;
      --text-main: #f0f6fc;
      --text-muted: #8b9bb4;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --hint-accent: #f59e0b;
      --hint-bg: rgba(245, 158, 11, 0.08);
      --sol-accent: #10b981;
      --sol-bg: rgba(16, 185, 129, 0.08);
      --code-bg: #080c14;
      --code-border: #1e293b;
      --badge-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      padding: 0 1rem 3rem 1rem;
    }

    /* Sticky Header & Progress Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 23, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 0;
      margin-bottom: 1.8rem;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .title-row h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .title-row h1 i {
      color: var(--accent);
    }

    .badge-counter {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--card-border);
      border-radius: 999px;
      margin-top: 1rem;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--sol-accent));
      transition: width 0.3s ease;
    }

    /* Controls, Search, and Category Filtering */
    .controls-wrapper {
      max-width: 1000px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1.1rem;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0b0f17;
      border-color: var(--accent);
      font-weight: 700;
    }

    .quick-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    .action-btn {
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    /* Main Container */
    main {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Exercise Card */
    .exercise-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .exercise-card:hover {
      border-color: #38bdf850;
    }

    .card-header {
      padding: 1.15rem 1.4rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      background: rgba(20, 27, 38, 0.7);
    }

    .card-header-left {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #fff;
    }

    .card-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .category-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .diff-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .diff-easy { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .diff-medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .diff-hard { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .cat-basics { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
    .cat-manip { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .cat-comp { background: rgba(245, 158, 11, 0.15); color: var(--hint-accent); border: 1px solid rgba(245, 158, 11, 0.3); }
    .cat-algo { background: rgba(16, 185, 129, 0.15); color: var(--sol-accent); border: 1px solid rgba(16, 185, 129, 0.3); }

    .card-body {
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .purpose-box {
      font-size: 0.88rem;
      color: var(--text-muted);
      border-left: 3px solid var(--accent);
      padding-left: 0.8rem;
      font-style: italic;
    }

    .io-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.2rem;
    }

    @media (max-width: 640px) {
      .io-grid { grid-template-columns: 1fr; }
    }

    .io-block {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      overflow-x: auto;
    }

    .io-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .complete-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .complete-toggle input {
      accent-color: var(--sol-accent);
      width: 1.15rem;
      height: 1.15rem;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.95rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-hint {
      background: var(--hint-bg);
      color: var(--hint-accent);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .btn-hint:hover {
      background: rgba(245, 158, 11, 0.2);
    }

    .btn-solution {
      background: var(--sol-bg);
      color: var(--sol-accent);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .btn-solution:hover {
      background: rgba(16, 185, 129, 0.2);
    }

    .drawer {
      display: none;
      border-radius: 6px;
      padding: 1rem;
      font-size: 0.9rem;
      animation: slideDown 0.2s ease forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .drawer.active {
      display: block;
    }

    .hint-drawer {
      background: var(--hint-bg);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fde68a;
    }

    .solution-drawer {
      background: rgba(16, 185, 129, 0.04);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .code-container {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.8rem;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0.8rem;
      background: #0f1623;
      border-bottom: 1px solid var(--code-border);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .copy-btn:hover {
      color: var(--text-main);
      background: #1e293b;
    }

    pre code {
      display: block;
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre;
    }

    .explanation {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--card-bg);
      padding: 0.85rem;
      border-radius: 6px;
      border-left: 3px solid var(--sol-accent);
    }

    .explanation strong {
      color: var(--text-main);
    }

    footer {
      max-width: 1000px;
      margin: 3rem auto 0 auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-content">
      <div class="title-row">
        <h1><i class="fa-brands fa-python"></i> Python List Mastery • 45 Practice Questions</h1>
        <div class="badge-counter" id="progress-text">0 / 45 Solved (0%)</div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </header>

  <!-- Controls, Search, and Category Filtering -->
  <div class="controls-wrapper">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search all 45 list exercises (e.g., slicing, comprehension, recursion, rotate, flatten, prefix)..." />
    <div class="controls">
      <button class="filter-btn active" data-filter="all">All (45)</button>
      <button class="filter-btn" data-filter="cat-basics">Basics &amp; Creation</button>
      <button class="filter-btn" data-filter="cat-manip">Manipulation &amp; Slicing</button>
      <button class="filter-btn" data-filter="cat-comp">Comprehensions &amp; Filtering</button>
      <button class="filter-btn" data-filter="cat-algo">Algorithms &amp; Nested Lists</button>

      <div class="quick-actions">
        <button class="action-btn" onclick="toggleAllHints()"><i class="fa-regular fa-lightbulb"></i> Toggle Hints</button>
        <button class="action-btn" onclick="collapseAll()"><i class="fa-solid fa-compress"></i> Collapse All</button>
      </div>
    </div>
  </div>

  <!-- Exercises Container -->
  <main id="exercises-list">
    <!-- Dynamically rendered via JavaScript -->
  </main>

  <footer>
    Python List Mastery • 45 Practice Questions • Clean, Self-Contained Learning Lab
  </footer>

  <script>
    const exercisesData = [
      {
        id: 1,
        title: "Perform Basic List Operations",
        category: "cat-basics",
        catLabel: "Basics & Creation",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Create a list containing five integers. Print its length, the first item, the middle item, and the last item using indexing.",
        purpose: "Learn list creation and zero-based as well as negative indexing in Python.",
        input: "numbers = [10, 20, 30, 40, 50]",
        output: "Length: 5, First: 10, Middle: 30, Last: 50",
        hint: "Use `len()`, index `0` for the first item, `len(lst) // 2` for the middle, and index `-1` for the last item.",
        code: `numbers = [10, 20, 30, 40, 50]

print(f"Length: {len(numbers)}")
print(f"First: {numbers[0]}")
print(f"Middle: {numbers[len(numbers) // 2]}")
print(f"Last: {numbers[-1]}")`,
        explanation: "Python lists are 0-indexed. Negative indices count backward from the end, making `-1` the last element."
      },
      {
        id: 2,
        title: "Perform List Manipulation",
        category: "cat-basics",
        catLabel: "Basics & Creation",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Start with an empty list. Append three numbers, insert a number at index 1, and remove the last number using `pop()`.",
        purpose: "Practice mutating lists in-place using `append()`, `insert()`, and `pop()`.",
        input: "Start empty; append 10, 20, 30; insert 15 at index 1; pop last",
        output: "[10, 15, 20] (popped: 30)",
        hint: "Use `lst.append(x)`, `lst.insert(1, y)`, and `popped_val = lst.pop()`.",
        code: `items = []
items.append(10)
items.append(20)
items.append(30)
items.insert(1, 15)
popped = items.pop()

print("Result List:", items)
print("Popped Element:", popped)`,
        explanation: "`.append()` adds to the end in O(1) amortized time, `.insert(index, val)` shifts elements right, and `.pop()` removes and returns the trailing element."
      },
      {
        id: 3,
        title: "Sum and Average of All Numbers in a List",
        category: "cat-basics",
        catLabel: "Basics & Creation",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Given a list of numbers, compute both the sum and average without using external libraries.",
        purpose: "Learn accumulation and basic statistical calculations on lists.",
        input: "scores = [85, 90, 78, 92, 88]",
        output: "Sum: 433, Average: 86.60",
        hint: "Use `sum(scores)` and divide by `len(scores)` with a zero-length guard.",
        code: `scores = [85, 90, 78, 92, 88]

total = sum(scores)
average = total / len(scores) if scores else 0

print(f"Sum: {total}")
print(f"Average: {average:.2f}")`,
        explanation: "`sum()` iterates through list elements in linear time O(n). Guarding against `len == 0` prevents a `ZeroDivisionError`."
      },
      {
        id: 4,
        title: "Find Maximum and Minimum from List",
        category: "cat-basics",
        catLabel: "Basics & Creation",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Find the maximum and minimum values in a list of integers using a manual loop (without `max()` and `min()`).",
        purpose: "Understand extreme-value search algorithms and running trackers.",
        input: "nums = [23, 7, 89, 45, 2, 60]",
        output: "Max: 89, Min: 2",
        hint: "Initialize `max_val` and `min_val` with the first element `nums[0]`, then iterate through the remainder.",
        code: `nums = [23, 7, 89, 45, 2, 60]

if nums:
    max_val = nums[0]
    min_val = nums[0]
    for n in nums[1:]:
        if n > max_val:
            max_val = n
        if n < min_val:
            min_val = n
    print(f"Max: {max_val}, Min: {min_val}")`,
        explanation: "Starting trackers with `nums[0]` ensures correct results regardless of negative or positive ranges."
      },
      {
        id: 5,
        title: "Calculate the Product of All Elements",
        category: "cat-basics",
        catLabel: "Basics & Creation",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Calculate the total product of all numbers in a list using a loop or `math.prod()`.",
        purpose: "Learn product accumulator patterns where the multiplicative identity is 1.",
        input: "factors = [2, 3, 4, 5]",
        output: "Product: 120",
        hint: "Initialize `product = 1` and multiply each element inside a `for` loop.",
        code: `factors = [2, 3, 4, 5]

product = 1
for x in factors:
    product *= x

print(f"Product: {product}")`,
        explanation: "Unlike sums initialized to 0, product accumulators must start at 1 so initial multiplications remain unchanged."
      },
      {
        id: 6,
        title: "Count Even and Odd Numbers",
        category: "cat-basics",
        catLabel: "Basics & Creation",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Count how many even and odd integers exist inside a given list.",
        purpose: "Apply parity branching with the modulo operator (`% 2`).",
        input: "nums = [1, 2, 3, 4, 5, 6, 7, 8, 9]",
        output: "Evens: 4, Odds: 5",
        hint: "Check if `x % 2 == 0` for evens, otherwise increment the odd counter.",
        code: `nums = [1, 2, 3, 4, 5, 6, 7, 8, 9]

evens = sum(1 for x in nums if x % 2 == 0)
odds = len(nums) - evens

print(f"Evens: {evens}, Odds: {odds}")`,
        explanation: "A generator expression counts even elements; subtracting that count from `len(nums)` instantly gives the odd count."
      },
      {
        id: 7,
        title: "Reverse a List",
        category: "cat-manip",
        catLabel: "Manipulation & Slicing",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Reverse a list in two ways: one producing a new list, and one modifying the original list in-place.",
        purpose: "Distinguish between slicing (`[::-1]`) and in-place mutation (`.reverse()`).",
        input: "original = [1, 2, 3, 4, 5]",
        output: "Reversed (copy): [5, 4, 3, 2, 1], In-place: [5, 4, 3, 2, 1]",
        hint: "Use `original[::-1]` to create a copy, or `original.reverse()` to mutate in-place.",
        code: `original = [1, 2, 3, 4, 5]

# Method 1: New copy using slicing
reversed_copy = original[::-1]
print("Reversed (copy):", reversed_copy)

# Method 2: In-place modification
original.reverse()
print("In-place:", original)`,
        explanation: "`[::-1]` leaves the original intact and allocates a new list, while `.reverse()` runs in O(1) auxiliary space."
      },
      {
        id: 8,
        title: "Sort a List of Numbers",
        category: "cat-manip",
        catLabel: "Manipulation & Slicing",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Sort a list in both ascending and descending order using both `sorted()` and `.sort()`.",
        purpose: "Understand Timsort and how `reverse=True` configures order.",
        input: "values = [42, 12, 88, 3, 25]",
        output: "Ascending: [3, 12, 25, 42, 88], Descending: [88, 42, 25, 12, 3]",
        hint: "`sorted(values)` returns a new list; `values.sort(reverse=True)` mutates in-place.",
        code: `values = [42, 12, 88, 3, 25]

# Ascending order copy
asc = sorted(values)
# Descending in-place
values.sort(reverse=True)

print("Ascending (sorted):", asc)
print("Descending (.sort):", values)`,
        explanation: "Python's Timsort operates in O(n log n) time. `sorted()` returns a new list; `.sort()` mutates the existing one."
      },
      {
        id: 9,
        title: "Create a Copy of a List",
        category: "cat-manip",
        catLabel: "Manipulation & Slicing",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Demonstrate creating a shallow copy versus a deep copy of a list containing nested sublists.",
        purpose: "Understand reference assignment, shallow copies (`.copy()`), and `copy.deepcopy()`.",
        input: "nested = [[1, 2], [3, 4]]",
        output: "Deep copy isolates internal mutations from the original",
        hint: "Use `copy.deepcopy()` from the standard library to duplicate nested structures completely.",
        code: `import copy

original = [[1, 2], [3, 4]]
shallow = original.copy()
deep = copy.deepcopy(original)

# Modify nested element in deep copy
deep[0][0] = 99

print("Original:", original)
print("Deep Copy:", deep)`,
        explanation: "Shallow copies share pointers to inner objects. `copy.deepcopy()` recursively duplicates all nested objects."
      },
      {
        id: 10,
        title: "Combine Two Lists",
        category: "cat-manip",
        catLabel: "Manipulation & Slicing",
        difficulty: "Easy",
        diffClass: "diff-easy",
        problem: "Combine two lists using the `+` operator, `.extend()`, and sequence unpacking (`*`).",
        purpose: "Explore multiple ways to concatenate and extend list collections.",
        input: "a = [1, 2, 3], b = [4, 5, 6]",
        output: "[1, 2, 3, 4, 5, 6]",
        hint: "You can write `a + b`, `[*a, *b]`, or call `a.extend(b)`.",
        code: `a = [1, 2, 3]
b = [4, 5, 6]

# Using concatenation operator
combined_plus = a + b
# Using iterable unpacking
combined_unpack = [*a, *b]

print("With + :", combined_plus)
print("With * :", combined_unpack)`,
        explanation: "The `+` and `[*a, *b]` patterns create new merged lists, while `a.extend(b)` appends items into `a` in-place."
      },
      {
        id: 11,
        title: "List Slicing: Extract Middle Elements",
        category: "cat-manip",

    const STORAGE_KEY = 'py_lists_45_solved';

    function getSolvedList() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveSolvedList(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function toggleComplete(id) {
      let solved = getSolvedList();
      if (solved.includes(id)) {
        solved = solved.filter(item => item !== id);
      } else {
        solved.push(id);
      }
      saveSolvedList(solved);
      updateProgress();
    }

    function updateProgress() {
      const solved = getSolvedList();
      const count = solved.length;
      const total = exercisesData.length;
      const pct = Math.round((count / total) * 100);

      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').innerText = `${count} / ${total} Solved (${pct}%)`;

      exercisesData.forEach(ex => {
        const checkbox = document.getElementById(`check-${ex.id}`);
        if (checkbox) {
          checkbox.checked = solved.includes(ex.id);
        }
      });
    }

    function toggleDrawer(id) {
      const drawer = document.getElementById(id);
      if (drawer) {
        drawer.classList.toggle('active');
      }
    }

    function copyCode(elementId, btn) {
      const codeElement = document.getElementById(elementId);
      if (!codeElement) return;
      const codeText = codeElement.innerText;

      const textArea = document.createElement("textarea");
      textArea.value = codeText;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        const origText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check" style="color: #10b981"></i> Copied!';
        setTimeout(() => {
          btn.innerHTML = origText;
        }, 1800);
      } catch (err) {
        console.error('Copy failed', err);
      }
      document.body.removeChild(textArea);
    }

    function toggleAllHints() {
      const hints = document.querySelectorAll('.hint-drawer');
      const anyOpen = Array.from(hints).some(d => d.classList.contains('active'));
      hints.forEach(d => {
        if (anyOpen) d.classList.remove('active');
        else d.classList.add('active');
      });
    }

    function collapseAll() {
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('active'));
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderExercises(list) {
      const container = document.getElementById('exercises-list');
      const solved = getSolvedList();

      if (list.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem; color: var(--text-muted); background: var(--card-bg); border-radius: 8px; border: 1px dashed var(--card-border);">
            <i class="fa-solid fa-magnifying-glass" style="font-size: 2rem; margin-bottom: 0.8rem; color: var(--accent);"></i>
            <p>No matching exercises found. Try a different search keyword.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(ex => `
        <article class="exercise-card" data-category="${ex.category}" id="ex-${ex.id}">
          <div class="card-header">
            <div class="card-header-left">
              <div class="card-title">Exercise ${ex.id}. ${ex.title}</div>
              <div class="card-meta">
                <span class="category-tag ${ex.category}">${ex.catLabel}</span>
                <span class="diff-badge ${ex.diffClass}">${ex.difficulty}</span>
              </div>
            </div>
            <label class="complete-toggle">
              <input type="checkbox" id="check-${ex.id}" onchange="toggleComplete(${ex.id})" ${solved.includes(ex.id) ? 'checked' : ''}> Solved
            </label>
          </div>
          <div class="card-body">
            <p><strong>Practice Problem:</strong> ${ex.problem}</p>
            <div class="purpose-box">${ex.purpose}</div>

            <div class="io-grid">
              <div class="io-block">
                <div class="io-label"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sample Input</div>
                ${escapeHtml(ex.input)}
              </div>
              <div class="io-block">
                <div class="io-label"><i class="fa-solid fa-square-poll-vertical"></i> Expected Output</div>
                ${escapeHtml(ex.output)}
              </div>
            </div>

            <div class="button-group">
              <button class="btn btn-hint" onclick="toggleDrawer('hint-${ex.id}')"><i class="fa-regular fa-lightbulb"></i> Hint</button>
              <button class="btn btn-solution" onclick="toggleDrawer('sol-${ex.id}')"><i class="fa-solid fa-code"></i> Show Solution</button>
            </div>

            <div class="drawer hint-drawer" id="hint-${ex.id}">
              <i class="fa-solid fa-circle-info"></i> ${ex.hint}
            </div>

            <div class="drawer solution-drawer" id="sol-${ex.id}">
              <div class="code-container">
                <div class="code-header">
                  <span>Python 3 • Clean Solution</span>
                  <button class="copy-btn" onclick="copyCode('code-${ex.id}', this)"><i class="fa-regular fa-copy"></i> Copy Code</button>
                </div>
                <pre><code id="code-${ex.id}">${escapeHtml(ex.code)}</code></pre>
              </div>
              <div class="explanation">
                <strong>Why This Works:</strong> ${ex.explanation}
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    let currentCategory = 'all';

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = exercisesData.filter(ex => {
        const matchesCategory = currentCategory === 'all' || ex.category === currentCategory;
        const matchesSearch = !query ||
          ex.title.toLowerCase().includes(query) ||
          ex.problem.toLowerCase().includes(query) ||
          ex.code.toLowerCase().includes(query) ||
          ex.catLabel.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      renderExercises(filtered);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-filter');
        filterCards();
      });
    });

    document.getElementById('searchInput').addEventListener('input', filterCards);

    // Initial render and progress sync on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      renderExercises(exercisesData);
      updateProgress();
    });
  </script>
</body>
</html>
