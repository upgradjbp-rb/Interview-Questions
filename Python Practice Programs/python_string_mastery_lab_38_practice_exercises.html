<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python String Mastery Lab • 38 Exercises</title>
  
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #141b26;
      --card-border: #243042;
      --text-main: #f0f6fc;
      --text-muted: #8b9bb4;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --hint-accent: #f59e0b;
      --hint-bg: rgba(245, 158, 11, 0.08);
      --sol-accent: #10b981;
      --sol-bg: rgba(16, 185, 129, 0.08);
      --code-bg: #080c14;
      --code-border: #1e293b;
      --badge-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      padding: 0 1rem 3rem 1rem;
    }

    /* Sticky Header & Progress Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 23, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 0;
      margin-bottom: 1.8rem;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .title-row h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .title-row h1 i {
      color: var(--accent);
    }

    .badge-counter {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--card-border);
      border-radius: 999px;
      margin-top: 1rem;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--sol-accent));
      transition: width 0.3s ease;
    }

    /* Controls, Search, and Category Filtering */
    .controls-wrapper {
      max-width: 1000px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1.1rem;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0b0f17;
      border-color: var(--accent);
      font-weight: 700;
    }

    .quick-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    .action-btn {
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    /* Main Container */
    main {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Exercise Card */
    .exercise-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .exercise-card:hover {
      border-color: #38bdf850;
    }

    .card-header {
      padding: 1.15rem 1.4rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      background: rgba(20, 27, 38, 0.7);
    }

    .card-header-left {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #fff;
    }

    .card-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .category-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cat-slice { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
    .cat-clean { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .cat-count { background: rgba(245, 158, 11, 0.15); color: var(--hint-accent); border: 1px solid rgba(245, 158, 11, 0.3); }
    .cat-algo { background: rgba(16, 185, 129, 0.15); color: var(--sol-accent); border: 1px solid rgba(16, 185, 129, 0.3); }

    .card-body {
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .purpose-box {
      font-size: 0.88rem;
      color: var(--text-muted);
      border-left: 3px solid var(--accent);
      padding-left: 0.8rem;
      font-style: italic;
    }

    .io-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.2rem;
    }

    @media (max-width: 640px) {
      .io-grid { grid-template-columns: 1fr; }
    }

    .io-block {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      overflow-x: auto;
    }

    .io-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .complete-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .complete-toggle input {
      accent-color: var(--sol-accent);
      width: 1.15rem;
      height: 1.15rem;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.95rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-hint {
      background: var(--hint-bg);
      color: var(--hint-accent);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .btn-hint:hover {
      background: rgba(245, 158, 11, 0.2);
    }

    .btn-solution {
      background: var(--sol-bg);
      color: var(--sol-accent);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .btn-solution:hover {
      background: rgba(16, 185, 129, 0.2);
    }

    .drawer {
      display: none;
      border-radius: 6px;
      padding: 1rem;
      font-size: 0.9rem;
      animation: slideDown 0.2s ease forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .drawer.active {
      display: block;
    }

    .hint-drawer {
      background: var(--hint-bg);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fde68a;
    }

    .solution-drawer {
      background: rgba(16, 185, 129, 0.04);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .code-container {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.8rem;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0.8rem;
      background: #0f1623;
      border-bottom: 1px solid var(--code-border);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .copy-btn:hover {
      color: var(--text-main);
      background: #1e293b;
    }

    pre code {
      display: block;
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre;
    }

    .explanation {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--card-bg);
      padding: 0.85rem;
      border-radius: 6px;
      border-left: 3px solid var(--sol-accent);
    }

    .explanation strong {
      color: var(--text-main);
    }

    footer {
      max-width: 1000px;
      margin: 3rem auto 0 auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="title-row">
        <h1><i class="fa-solid fa-lines-leaning"></i> Python String Mastery Lab</h1>
        <div class="badge-counter" id="progress-text">0 / 38 Solved (0%)</div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </header>

  <!-- Controls, Search, and Category Filtering -->
  <div class="controls-wrapper">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search all 38 string exercises (e.g. slicing, palindrome, regex, anagram, title case)..." />
    <div class="controls">
      <button class="filter-btn active" data-filter="all">All (38)</button>
      <button class="filter-btn" data-filter="cat-slice">Slicing &amp; Indexing</button>
      <button class="filter-btn" data-filter="cat-clean">Transformation &amp; Cleaning</button>
      <button class="filter-btn" data-filter="cat-count">Analysis &amp; Counting</button>
      <button class="filter-btn" data-filter="cat-algo">Algorithms &amp; Patterns</button>
      
      <div class="quick-actions">
        <button class="action-btn" onclick="toggleAllHints()"><i class="fa-regular fa-lightbulb"></i> Toggle Hints</button>
        <button class="action-btn" onclick="collapseAll()"><i class="fa-solid fa-compress"></i> Collapse All</button>
      </div>
    </div>
  </div>

  <!-- Exercises Container -->
  <main id="exercises-list">
    <!-- Dynamically rendered via JavaScript -->
  </main>

  <footer>
    Python String Mastery Lab • 38 Practice Exercises • Built for Interactive Learning
  </footer>

  <script>
    const exercisesData = [
      {
        id: 1,
        title: "Create a string made of the first, middle, and last character",
        category: "cat-slice",
        catLabel: "Slicing & Indexing",
        problem: "Given a string of odd length greater than 2, return a new string made of the first, middle, and last characters of the input string.",
        purpose: "Learn string indexing, floor division for midpoints, and string concatenation.",
        input: 'str1 = "James"',
        output: '"Jms"',
        hint: "Find the middle index using `len(str1) // 2`. Combine `str1[0]`, `str1[mid]`, and `str1[-1]`.",
        code: `str1 = "James"

# Calculate middle index
mid = len(str1) // 2

# Concatenate first, middle, and last character
res = str1[0] + str1[mid] + str1[-1]

print("Original:", str1)
print("New String:", res)`,
        explanation: "In 'James' (length 5), integer division 5 // 2 gives index 2 ('m'). Index 0 gives 'J' and index -1 gives 's'."
      },
      {
        id: 2,
        title: "Create a string made of the middle three characters",
        category: "cat-slice",
        catLabel: "Slicing & Indexing",
        problem: "Given a string of odd length greater than 4, return a new string made of the middle three characters.",
        purpose: "Master range slicing relative to a central pivot point.",
        input: 'str1 = "JhonDipPeta" and str2 = "JaSonAy"',
        output: '"Dip" and "Son"',
        hint: "Calculate `mid = len(s) // 2`. Extract slice from `mid - 1` to `mid + 2`.",
        code: `def middle_three(s):
    mid = len(s) // 2
    return s[mid - 1 : mid + 2]

print(middle_three("JhonDipPeta"))
print(middle_three("JaSonAy"))`,
        explanation: "For length 11, mid is 5 ('i'). The slice [5-1:5+2] is [4:7], which extracts characters at index 4, 5, and 6 ('Dip')."
      },
      {
        id: 3,
        title: "Append new string in the middle of a given string",
        category: "cat-slice",
        catLabel: "Slicing & Indexing",
        problem: "Given two strings `s1` and `s2`, append `s2` directly in the exact middle of `s1`.",
        purpose: "Splitting strings by index and injecting substrings via concatenation.",
        input: 's1 = "Ault", s2 = "Kelly"',
        output: '"AuKellylt"',
        hint: "Split s1 at `mid = len(s1) // 2`. Join `s1[:mid] + s2 + s1[mid:]`.",
        code: `s1 = "Ault"
s2 = "Kelly"

mid = len(s1) // 2
result = s1[:mid] + s2 + s1[mid:]

print("Result:", result)`,
        explanation: "len('Ault') is 4, so mid is 2. s1[:2] is 'Au' and s1[2:] is 'lt'. Inserting s2 yields 'AuKellylt'."
      },
      {
        id: 4,
        title: "Create a new string made of the first, middle, and last characters of each input string",
        category: "cat-slice",
        catLabel: "Slicing & Indexing",
        problem: "Given two strings `s1` and `s2`, extract the first, middle, and last characters of each and combine them.",
        purpose: "Coordinate dual-string index extractions into a composite sequence.",
        input: 's1 = "America", s2 = "Japan"',
        output: '"AJrpan"',
        hint: "Extract first from s1 and s2, mid from s1 and s2, last from s1 and s2, and concatenate.",
        code: `s1 = "America"
s2 = "Japan"

first = s1[0] + s2[0]
middle = s1[len(s1) // 2] + s2[len(s2) // 2]
last = s1[-1] + s2[-1]

result = first + middle + last
print("Combined String:", result)`,
        explanation: "s1 provides 'A', 'r', 'a'; s2 provides 'J', 'p', 'n'. Grouping by position produces 'AJ' + 'rp' + 'an' = 'AJrpan'."
      },
      {
        id: 5,
        title: "Reverse a given string",
        category: "cat-slice",
        catLabel: "Slicing & Indexing",
        problem: "Reverse the contents of a given string using Python's extended slicing notation.",
        purpose: "Understand sequence stepping with negative step increments.",
        input: 's = "PYnative"',
        output: '"evitanYP"',
        hint: "Use slice syntax with a step of -1: `s[::-1]`.",
        code: `s = "PYnative"
reversed_s = s[::-1]

print("Original:", s)
print("Reversed:", reversed_s)`,
        explanation: "[::-1] specifies start at default (end), stop at default (beginning), and step backwards by 1."
      },
      {
        id: 6,
        title: "Find the last position of a given substring",
        category: "cat-count",
        catLabel: "Analysis & Counting",
        problem: "Write a program to find the last position (index) of a substring 'Emma' in a given string.",
        purpose: "Explore `str.rfind()` for right-to-left substring searches.",
        input: 'str1 = "Emma is a data scientist who knows Python. Emma works at google."',
        output: "Last occurrence of Emma starts at index 43",
        hint: "Use the `rfind()` method instead of `find()`.",
        code: `str1 = "Emma is a data scientist who knows Python. Emma works at google."
index = str1.rfind("Emma")

print(f"Last occurrence of Emma starts at index {index}")`,
        explanation: "str.rfind() returns the highest index where the substring is found, returning -1 if not found."
      },
      {
        id: 7,
        title: "Split a string on hyphens",
        category: "cat-clean",
        catLabel: "Transformation & Cleaning",
        problem: "Split a given string of hyphen-separated words and display each substring on its own line.",
        purpose: "Tokenize strings using custom delimiters with `str.split()`.",
        input: 'str1 = "Emma-is-a-data-scientist"',
        output: "Emma\\nis\\na\\ndata\\nscientist",
        hint: "Call `str1.split('-')` and loop through the resulting list.",
        code: `str1 = "Emma-is-a-data-scientist"
sub_strings = str1.split("-")

for item in sub_strings:
    print(item)`,
        explanation: "str.split('-') splits the string on every hyphen, returning a list of cleaned word tokens."
      },
      {
        id: 8,
        title: "Find all occurrences of a substring in a given string by ignoring the case",
        category: "cat-count",
        catLabel: "Analysis & Counting",
        problem: "Find and count all occurrences of substring 'USA' in a text sentence regardless of letter case.",
        purpose: "Case-insensitive substring search with `str.lower()` and `str.count()`.",
        input: 'str1 = "Welcome to USA. usa awesome, isn\'t it?"',
        output: "The USA count is: 2",
        hint: "Convert the target string and search term to lowercase before calling `.count()`.",
        code: `str1 = "Welcome to USA. usa awesome, isn't it?"
substring = "USA"

count = str1.lower().count(substring.lower())
print(f"The {substring} count is: {count}")`,
        explanation: "Converting both strings to lowercase with .lower() ensures casing differences do not affect the frequency count."
      },
      {
        id: 9,
        title: "String characters balance test",
        category: "cat-algo",
        catLabel: "Algorithms & Patterns",
        problem: "Write a program to check if all characters in string `s1` are present inside string `s2`.",
        purpose: "Character subset testing and membership checks with `all()`.",
        input: 's1 = "Yn", s2 = "PYnative" and s1 = "Ynf", s2 = "PYnative"',
        output: "True and False",
        hint: "Check if `all(char in s2 for char in s1)`.",
        code: `def is_balanced(s1, s2):
    return all(char in s2 for char in s1)

print("Test 1:", is_balanced("Yn", "PYnative"))
print("Test 2:", is_balanced("Ynf", "PYnative"))`,
        explanation: "The generator expression checks each character of s1 in s2. `all()` returns True only if every single test evaluates to True."
      },
      {
        id: 10,
        title: "Vowel Counter",
        category: "cat-count",
        catLabel: "Analysis & Counting",
        problem: "Count the total number of vowels (A, E, I, O, U) present in a string regardless of case.",
        purpose: "Membership testing across vowel sets using comprehension counting.",
        input: 'text = "Data Science with Python"',
        output: "Total vowels: 7",
        hint: "Sum matches where `char.lower() in 'aeiou'`.",
        code: `text = "Data Science with Python"
vowels = "aeiou"

count = sum(1 for char in text.lower() if char in vowels)
print(f"Total vowels: {count}")`,
        explanation: "sum(1 for ...) iterates over each character in O(n) time, incrementing the accumulator for each vowel match."
      },
      {
        id: 11,
        title: "Prefix/Suffix Check",
        category: "cat-clean",
        catLabel: "Transformation & Cleaning",
        problem: "Check if a given URL starts with 'https://' and ends with '.com' or '.org'.",
        purpose: "Validate string boundaries using `startswith()` and `endswith()` tuples.",
        input: 'url = "https://example.com"',
        output: "Valid Secure Web URL: True",
        hint: "`endswith()` accepts a tuple of valid candidate suffixes.",
        code: `url = "https://example.com"

is_secure = url.startswith("https://")
is_valid_domain = url.endswith((".com", ".org", ".net"))

print("Is secure:", is_secure)
print("Valid domain:", is_valid_domain)
print("Valid Secure Web URL:", is_secure and is_valid_domain)`,
        explanation: "Passing a tuple to .endswith() checks multiple file or domain extensions in a single call."
      },
      {
        id: 12,
        title: "Swap Case",
        category: "cat-clean",
        catLabel: "Transformation & Cleaning",
        problem: "Convert all uppercase letters to lowercase and all lowercase letters to uppercase in a given string.",
        purpose: "Explore `str.swapcase()` and character case inversion.",
        input: 's = "Python 3.12 Is AWESOME"',
        output: '"pYTHON 3.12 iS awesome"',
        hint: "Use the built-in `swapcase()` method.",
        code: `s = "Python 3.12 Is AWESOME"
swapped = s.swapcase()

print("Original:", s)
print("Swapped :", swapped)`,
        explanation: "str.swapcase() flips uppercase to lowercase and vice versa while leaving numbers and punctuation untouched."
      },
      {
        id: 13,
        title: "Remove Whitespace",
        category: "cat-clean",
        catLabel: "Transformation & Cleaning",
        problem: "Remove all leading, trailing, and duplicate spaces, leaving words separated by single spaces.",
        purpose: "String normalization with `.split()` and `.join()`.",
        input: 's = "   Learning    Python    Strings   "',
        output: '"Learning Python Strings"',
        hint: "Calling `.split()` with no arguments splits on arbitrary whitespace. Join with `' '.join()`.",
        code: `s = "   Learning    Python    Strings   "

    const STORAGE_KEY = 'py_strings_38_solved';

    function getSolvedList() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveSolvedList(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function toggleComplete(id) {
      let solved = getSolvedList();
      if (solved.includes(id)) {
        solved = solved.filter(item => item !== id);
      } else {
        solved.push(id);
      }
      saveSolvedList(solved);
      updateProgress();
    }

    function updateProgress() {
      const solved = getSolvedList();
      const count = solved.length;
      const total = exercisesData.length;
      const pct = Math.round((count / total) * 100);

      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').innerText = `${count} / ${total} Solved (${pct}%)`;

      exercisesData.forEach(ex => {
        const checkbox = document.getElementById(`check-${ex.id}`);
        if (checkbox) {
          checkbox.checked = solved.includes(ex.id);
        }
      });
    }

    function toggleDrawer(id) {
      const drawer = document.getElementById(id);
      if (drawer) {
        drawer.classList.toggle('active');
      }
    }

    function copyCode(elementId, btn) {
      const codeElement = document.getElementById(elementId);
      if (!codeElement) return;
      const codeText = codeElement.innerText;
      
      const textArea = document.createElement("textarea");
      textArea.value = codeText;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        const origText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check" style="color: #10b981"></i> Copied!';
        setTimeout(() => {
          btn.innerHTML = origText;
        }, 1800);
      } catch (err) {
        console.error('Copy failed', err);
      }
      document.body.removeChild(textArea);
    }

    function toggleAllHints() {
      const hints = document.querySelectorAll('.hint-drawer');
      const anyOpen = Array.from(hints).some(d => d.classList.contains('active'));
      hints.forEach(d => {
        if (anyOpen) d.classList.remove('active');
        else d.classList.add('active');
      });
    }

    function collapseAll() {
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('active'));
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderExercises(list) {
      const container = document.getElementById('exercises-list');
      const solved = getSolvedList();

      if (list.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem; color: var(--text-muted); background: var(--card-bg); border-radius: 8px; border: 1px dashed var(--card-border);">
            <i class="fa-solid fa-magnifying-glass" style="font-size: 2rem; margin-bottom: 0.8rem; color: var(--accent);"></i>
            <p>No matching exercises found. Try a different search keyword.</p>
          </div>
        `;
        return;

      container.innerHTML = list.map(ex => `

            </div>
            <label class="complete-toggle">
              <input type="checkbox" id="check-${ex.id}" onchange="toggleComplete(${ex.id})" ${solved.includes(ex.id) ? 'checked' : ''}> Solved
            </label>
          </div>
          <div class="card-body">
            <p><strong>Practice Problem:</strong> ${ex.problem}</p>
            <div class="purpose-box">${ex.purpose}</div>
            
            <div class="io-grid">
              <div class="io-block">
                <div class="io-label"><i class="fa-solid fa-arrow-right-to-bracket"></i> Given Input</div>
                ${escapeHtml(ex.input)}
              </div>
              <div class="io-block">
                <div class="io-label"><i class="fa-solid fa-square-poll-vertical"></i> Expected Output</div>
                ${escapeHtml(ex.output)}
              </div>
            </div>

            <div class="button-group">
              <button class="btn btn-hint" onclick="toggleDrawer('hint-${ex.id}')"><i class="fa-regular fa-lightbulb"></i> Hint</button>
              <button class="btn btn-solution" onclick="toggleDrawer('sol-${ex.id}')"><i class="fa-solid fa-code"></i> Show Solution</button>
            </div>

            <div class="drawer hint-drawer" id="hint-${ex.id}">
              <i class="fa-solid fa-circle-info"></i> ${ex.hint}
            </div>

            <div class="drawer solution-drawer" id="sol-${ex.id}">
              <div class="code-container">
                <div class="code-header">
                  <span>Python 3 • Tested Solution</span>
                  <button class="copy-btn" onclick="copyCode('code-${ex.id}', this)"><i class="fa-regular fa-copy"></i> Copy Code</button>
                </div>
                <pre><code id="code-${ex.id}">${escapeHtml(ex.code)}</code></pre>
              </div>
              <div class="explanation">
                <strong>Why This Works:</strong> ${ex.explanation}
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    let currentCategory = 'all';

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      
      const filtered = exercisesData.filter(ex => {
        const matchesCategory = currentCategory === 'all' || ex.category === currentCategory;
        const matchesSearch = !query || 
          ex.title.toLowerCase().includes(query) || 
          ex.problem.toLowerCase().includes(query) || 
          ex.code.toLowerCase().includes(query) ||
          ex.catLabel.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      renderExercises(filtered);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-filter');
        filterCards();
      });
    });

    document.getElementById('searchInput').addEventListener('input', filterCards);

    // Initial render
    document.addEventListener('DOMContentLoaded', () => {
      renderExercises(exercisesData);
      updateProgress();
    });
  </script>
</body>
</html>
